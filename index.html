<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pitch Match Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    transition: background 0.3s ease;
  }

  #game {
    text-align: center;
    max-width: 440px;
    width: 92%;
  }

  h1 { margin-bottom: 6px; }

  #difficulty {
    font-size: 0.9rem;
    opacity: 0.85;
    margin-bottom: 10px;
  }

  button {
    font-size: 1.2rem;
    padding: 12px 18px;
    margin: 8px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: #333;
    color: white;
  }

  #progress-container {
    width: 100%;
    background: #333;
    border-radius: 10px;
    margin: 15px 0;
    height: 18px;
    overflow: hidden;
  }

  #progress-bar {
    height: 100%;
    width: 0%;
    background: limegreen;
    transition: width 0.3s;
  }

  #status {
    margin-top: 10px;
    min-height: 24px;
    font-size: 1.05rem;
  }

  .green { background: #0a3; }
  .red { background: #a00; }

  #endControls {
    margin-top: 15px;
    display: none;
  }
</style>
</head>
<body>

<div id="game">
  <h1>Pitch Match</h1>
  <div id="difficulty"></div>

  <p>Was the second tone the SAME?</p>

  <div id="progress-container">
    <div id="progress-bar"></div>
  </div>

  <button id="yesBtn">F = YES</button>
  <button id="noBtn">J = NO</button>

  <div id="status">Press SPACE to start</div>

  <div id="endControls">
    <button onclick="restartGame()">Play Again</button>
    <button onclick="resetDifficulty()">Reset Difficulty</button>
  </div>
</div>

<script>
const TOTAL_ROUNDS = 20;
let round = 0;
let currentAnswerSame = false;
let waitingForStart = true;
let audioReady = false;

// Difficulty in cents (logarithmic)
let difficultyCents = parseFloat(localStorage.getItem("difficulty")) || 120;

const MIN_CENTS = 5;
const MAX_CENTS = 800;

// Expanded pitch range (+300 Hz on top end)
const pitches = Array.from({ length: 40 }, (_, i) => {
  const min = 150;
  const max = 2500 + 300; // +300 Hz increase
  const ratio = i / 39;
  return min * Math.pow(max / min, ratio);
});

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function updateDifficultyDisplay() {
  document.getElementById("difficulty").textContent =
    "Difficulty: ±" + difficultyCents.toFixed(1) + " cents";
}

/* ---------- AUDIO PERCEPTION IMPROVEMENTS ---------- */

// Equal perceived loudness curve (approx psychoacoustic correction)
function getVolume(freq) {
  const min = 150;
  const max = 2800;

  const norm = (freq - min) / (max - min);

  // flatten perceived loudness curve
  let v = 0.45 * Math.pow(1 - norm, 1.3);

  return Math.max(0.04, v);
}

function centsToRatio(cents) {
  return Math.pow(2, cents / 1200);
}

function playTone(freq, duration = 0.5) {
  return new Promise(resolve => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = "sine";
    osc.frequency.value = freq;

    const vol = getVolume(freq);

    gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(vol, audioCtx.currentTime + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + duration);

    osc.onended = resolve;
  });
}

/* ---------- GAME LOGIC ---------- */

async function playRound() {
  waitingForStart = false;
  document.body.classList.remove("green", "red");
  document.getElementById("status").textContent = "Listen...";

  await new Promise(r => setTimeout(r, 450));

  let baseFreq = pitches[Math.floor(Math.random() * pitches.length)];
  await playTone(baseFreq);

  await new Promise(r => setTimeout(r, 350));

  currentAnswerSame = Math.random() < 0.5;

  let secondFreq;

  if (currentAnswerSame) {
    secondFreq = baseFreq;
  } else {
    const direction = Math.random() < 0.5 ? -1 : 1;

    // convert cents → frequency ratio (balanced across range)
    const ratio = centsToRatio(difficultyCents * direction);
    secondFreq = baseFreq * ratio;
  }

  await playTone(secondFreq);

  document.getElementById("status").textContent = "Your guess?";
}

function playFeedback(correct) {
  const duration = 0.28;

  // Pleasant intervals (musical harmony instead of beeps)
  const correctPair = [523.25, 659.25]; // C5 → E5 (major third, pleasant)
  const wrongPair = [220, 185];         // soft low interval (less harsh)

  const freqs = correct ? correctPair : wrongPair;

  freqs.forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = "sine";
    osc.frequency.value = freq;

    // reuse your loudness model for consistency
    const baseVol = getVolume(freq) * (correct ? 0.55 : 0.45);

    gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(
      baseVol,
      audioCtx.currentTime + 0.02
    );
    gain.gain.exponentialRampToValueAtTime(
      0.0001,
      audioCtx.currentTime + duration
    );

    // slight timing offset for “chime” effect
    const startTime = audioCtx.currentTime + i * 0.03;

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start(startTime);
    osc.stop(startTime + duration);
  });
}

function updateProgress() {
  const pct = (round / TOTAL_ROUNDS) * 100;
  document.getElementById("progress-bar").style.width = pct + "%";
}

function adjustDifficulty(correct) {
  if (correct) difficultyCents *= 0.88;
  else difficultyCents *= 1.18;

  difficultyCents = Math.max(MIN_CENTS, Math.min(MAX_CENTS, difficultyCents));

  localStorage.setItem("difficulty", difficultyCents);
  updateDifficultyDisplay();
}

/* ---------- INPUT ---------- */

function handleAnswer(isYes) {
  if (round >= TOTAL_ROUNDS || waitingForStart) return;

  const correct = (isYes === currentAnswerSame);

  document.body.classList.add(correct ? "green" : "red");
  playFeedback(correct);
  adjustDifficulty(correct);

  round++;
  updateProgress();

  if (round >= TOTAL_ROUNDS) {
    document.getElementById("status").textContent = "Game Over!";
    document.getElementById("endControls").style.display = "block";
    return;
  }

  waitingForStart = true;
  document.getElementById("status").textContent = "Press SPACE to continue";
}

/* ---------- CONTROLS ---------- */

document.getElementById("yesBtn").onclick = () => handleAnswer(true);
document.getElementById("noBtn").onclick = () => handleAnswer(false);

document.addEventListener("keydown", async (e) => {
  if (!audioReady) {
    await audioCtx.resume();
    audioReady = true;
  }

  if (e.key.toLowerCase() === "f") handleAnswer(true);
  if (e.key.toLowerCase() === "j") handleAnswer(false);

  if (e.code === "Space") {
    e.preventDefault();
    if (waitingForStart && round < TOTAL_ROUNDS) {
      playRound();
    }
  }
});

/* ---------- RESET ---------- */

function restartGame() {
  round = 0;
  updateProgress();
  document.getElementById("endControls").style.display = "none";
  waitingForStart = true;
  document.getElementById("status").textContent = "Press SPACE to start";
}

function resetDifficulty() {
  difficultyCents = 120;
  localStorage.setItem("difficulty", difficultyCents);
  updateDifficultyDisplay();
}

/* ---------- INIT ---------- */

updateDifficultyDisplay();

</script>
  
</body>
</html>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pitch Match Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    transition: background 0.3s ease;
  }

  #game {
    text-align: center;
    max-width: 420px;
    width: 90%;
  }

  h1 {
    margin-bottom: 5px;
  }

  #difficulty {
    font-size: 0.9rem;
    opacity: 0.8;
    margin-bottom: 10px;
  }

  button {
    font-size: 1.3rem;
    padding: 12px 20px;
    margin: 8px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: #333;
    color: white;
  }

  #progress-container {
    width: 100%;
    background: #333;
    border-radius: 10px;
    margin: 15px 0;
    height: 18px;
    overflow: hidden;
  }

  #progress-bar {
    height: 100%;
    width: 0%;
    background: limegreen;
    transition: width 0.3s;
  }

  #status {
    margin-top: 10px;
    min-height: 24px;
  }

  .green { background: #0a3; }
  .red { background: #a00; }

  #endControls {
    margin-top: 15px;
    display: none;
  }
</style>
</head>
<body>

<div id="game">
  <h1>Pitch Match</h1>
  <div id="difficulty">Difficulty: --</div>
  <p>Was the second tone the SAME?</p>

  <div id="progress-container">
    <div id="progress-bar"></div>
  </div>

  <button id="yesBtn">F = YES</button>
  <button id="noBtn">J = NO</button>

  <div id="status"></div>

  <div id="endControls">
    <button onclick="restartGame()">Play Again</button>
    <button onclick="resetDifficulty()">Reset Difficulty</button>
  </div>
</div>

<script>
const TOTAL_ROUNDS = 20;
let round = 0;
let currentAnswerSame = false;

// Load persistent difficulty
let difficultyOffset = parseFloat(localStorage.getItem("difficulty")) || 80;

const MIN_OFFSET = 3;
const MAX_OFFSET = 200;

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

const pitches = Array.from({length: 20}, (_, i) => {
  const min = 200;
  const max = 4000;
  const ratio = i / 19;
  return min * Math.pow(max/min, ratio);
});

function updateDifficultyDisplay() {
  document.getElementById("difficulty").textContent =
    "Difficulty (difference): " + difficultyOffset.toFixed(1) + " Hz";
}

function playTone(freq, duration = 0.5) {
  return new Promise(resolve => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.frequency.value = freq;
    osc.type = "sine";

    gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.5, audioCtx.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + duration);

    osc.onended = resolve;
  });
}

async function playRound() {
  document.body.classList.remove("green", "red");
  document.getElementById("status").textContent = "Listen...";

  await new Promise(r => setTimeout(r, 500));

  let baseFreq = pitches[Math.floor(Math.random() * pitches.length)];
  await playTone(baseFreq);

  await new Promise(r => setTimeout(r, 300));

  currentAnswerSame = Math.random() < 0.5;

  let secondFreq;
  if (currentAnswerSame) {
    secondFreq = baseFreq;
  } else {
    const direction = Math.random() < 0.5 ? -1 : 1;
    secondFreq = Math.max(100, baseFreq + direction * difficultyOffset);
  }

  await playTone(secondFreq);

  document.getElementById("status").textContent = "Your guess?";
}

function playFeedback(correct) {
  playTone(correct ? 800 : 200, 0.2);
}

function updateProgress() {
  const percent = (round / TOTAL_ROUNDS) * 100;
  document.getElementById("progress-bar").style.width = percent + "%";
}

function adjustDifficulty(correct) {
  if (correct) {
    difficultyOffset *= 0.85;
  } else {
    difficultyOffset *= 1.25;
  }

  difficultyOffset = Math.max(MIN_OFFSET, Math.min(MAX_OFFSET, difficultyOffset));

  localStorage.setItem("difficulty", difficultyOffset);
  updateDifficultyDisplay();
}

function handleAnswer(isYes) {
  if (round >= TOTAL_ROUNDS) return;

  const correct = (isYes === currentAnswerSame);

  document.body.classList.add(correct ? "green" : "red");
  playFeedback(correct);
  adjustDifficulty(correct);

  round++;
  updateProgress();

  if (round >= TOTAL_ROUNDS) {
    document.getElementById("status").textContent = "Game Over!";
    document.getElementById("endControls").style.display = "block";
    return;
  }

  setTimeout(playRound, 800);
}

function restartGame() {
  round = 0;
  updateProgress();
  document.getElementById("endControls").style.display = "none";
  document.getElementById("status").textContent = "";
  playRound();
}

function resetDifficulty() {
  difficultyOffset = 80;
  localStorage.setItem("difficulty", difficultyOffset);
  updateDifficultyDisplay();
}

document.getElementById("yesBtn").onclick = () => handleAnswer(true);
document.getElementById("noBtn").onclick = () => handleAnswer(false);

document.addEventListener("keydown", (e) => {
  if (e.key.toLowerCase() === "f") handleAnswer(true);
  if (e.key.toLowerCase() === "j") handleAnswer(false);
});

document.body.addEventListener("click", async () => {
  if (audioCtx.state === "suspended") {
    await audioCtx.resume();
  }
  if (round === 0) {
    updateDifficultyDisplay();
    playRound();
  }
}, { once: true });

updateDifficultyDisplay();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pitch Match Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    transition: background 0.3s ease;
  }

  #game {
    text-align: center;
    max-width: 420px;
    width: 90%;
  }

  h1 { margin-bottom: 5px; }

  #difficulty {
    font-size: 0.9rem;
    opacity: 0.8;
    margin-bottom: 10px;
  }

  button {
    font-size: 1.3rem;
    padding: 12px 20px;
    margin: 8px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: #333;
    color: white;
  }

  #progress-container {
    width: 100%;
    background: #333;
    border-radius: 10px;
    margin: 15px 0;
    height: 18px;
    overflow: hidden;
  }

  #progress-bar {
    height: 100%;
    width: 0%;
    background: limegreen;
    transition: width 0.3s;
  }

  #status {
    margin-top: 10px;
    min-height: 24px;
    font-size: 1.1rem;
  }

  .green { background: #0a3; }
  .red { background: #a00; }

  #endControls {
    margin-top: 15px;
    display: none;
  }
</style>
</head>
<body>

<div id="game">
  <h1>Pitch Match</h1>
  <div id="difficulty"></div>
  <p>Was the second tone the SAME?</p>

  <div id="progress-container">
    <div id="progress-bar"></div>
  </div>

  <button id="yesBtn">F = YES</button>
  <button id="noBtn">J = NO</button>

  <div id="status">Press SPACE to start</div>

  <div id="endControls">
    <button onclick="restartGame()">Play Again</button>
    <button onclick="resetDifficulty()">Reset Difficulty</button>
  </div>
</div>

<script>
const TOTAL_ROUNDS = 20;
let round = 0;
let currentAnswerSame = false;
let waitingForStart = true;
let audioReady = false;

// 🔽 Lower minimum difficulty
const MIN_OFFSET = 1;
const MAX_OFFSET = 200;

let difficultyOffset = parseFloat(localStorage.getItem("difficulty")) || 80;

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

// 🔻 Lower pitch range
const pitches = Array.from({length: 20}, (_, i) => {
  const min = 150;
  const max = 2200;
  const ratio = i / 19;
  return min * Math.pow(max/min, ratio);
});

function updateDifficultyDisplay() {
  document.getElementById("difficulty").textContent =
    "Difficulty: " + difficultyOffset.toFixed(1) + " Hz difference";
}

// 🔊 Stronger high-frequency attenuation
function getVolumeForFrequency(freq) {
  const minFreq = 150;
  const maxFreq = 2200;

  const normalized = (freq - minFreq) / (maxFreq - minFreq);

  // stronger curve + lower ceiling
  let volume = 0.35 * Math.pow(1 - normalized, 1.7);

  return Math.max(0.04, volume);
}

function playTone(freq, duration = 0.5) {
  return new Promise(resolve => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.frequency.value = freq;
    osc.type = "sine";

    const volume = getVolumeForFrequency(freq);

    gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(volume, audioCtx.currentTime + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + duration);

    osc.onended = resolve;
  });
}

async function playRound() {
  waitingForStart = false;
  document.body.classList.remove("green", "red");
  document.getElementById("status").textContent = "Listen...";

  await new Promise(r => setTimeout(r, 500));

  let baseFreq = pitches[Math.floor(Math.random() * pitches.length)];
  await playTone(baseFreq);

  await new Promise(r => setTimeout(r, 400));

  currentAnswerSame = Math.random() < 0.5;

  let secondFreq;
  if (currentAnswerSame) {
    secondFreq = baseFreq;
  } else {
    const direction = Math.random() < 0.5 ? -1 : 1;
    secondFreq = Math.max(100, baseFreq + direction * difficultyOffset);
  }

  await playTone(secondFreq);

  document.getElementById("status").textContent = "Your guess?";
}

function playFeedback(correct) {
  playTone(correct ? 600 : 180, 0.25);
}

function updateProgress() {
  const percent = (round / TOTAL_ROUNDS) * 100;
  document.getElementById("progress-bar").style.width = percent + "%";
}

function adjustDifficulty(correct) {
  if (correct) difficultyOffset *= 0.85;
  else difficultyOffset *= 1.25;

  difficultyOffset = Math.max(MIN_OFFSET, Math.min(MAX_OFFSET, difficultyOffset));
  localStorage.setItem("difficulty", difficultyOffset);
  updateDifficultyDisplay();
}

function handleAnswer(isYes) {
  if (round >= TOTAL_ROUNDS || waitingForStart) return;

  const correct = (isYes === currentAnswerSame);

  document.body.classList.add(correct ? "green" : "red");
  playFeedback(correct);
  adjustDifficulty(correct);

  round++;
  updateProgress();

  if (round >= TOTAL_ROUNDS) {
    document.getElementById("status").textContent = "Game Over!";
    document.getElementById("endControls").style.display = "block";
    return;
  }

  waitingForStart = true;
  document.getElementById("status").textContent = "Press SPACE to start next round";
}

function restartGame() {
  round = 0;
  updateProgress();
  document.getElementById("endControls").style.display = "none";
  waitingForStart = true;
  document.getElementById("status").textContent = "Press SPACE to start";
}

function resetDifficulty() {
  difficultyOffset = 80;
  localStorage.setItem("difficulty", difficultyOffset);
  updateDifficultyDisplay();
}

document.getElementById("yesBtn").onclick = () => handleAnswer(true);
document.getElementById("noBtn").onclick = () => handleAnswer(false);

document.addEventListener("keydown", async (e) => {
  if (!audioReady) {
    await audioCtx.resume();
    audioReady = true;
  }

  if (e.key.toLowerCase() === "f") handleAnswer(true);
  if (e.key.toLowerCase() === "j") handleAnswer(false);

  if (e.code === "Space") {
    e.preventDefault();
    if (waitingForStart && round < TOTAL_ROUNDS) {
      playRound();
    }
  }
});

updateDifficultyDisplay();
</script>
</body>
</html>

</body>
